# AMMT layer-camera normalization and saturation-validity policy.
# Source statistics: processed/normalization_v1/ (train history layers z=1..157 only).
# This config contains no image pixels and does not alter raw TIFF files.

version: 1
status: active_for_dataset_baseline

provenance:
  source_manifest: manifests/causal_sequence_manifest.csv
  source_split: train
  train_manifest_rows: 154
  unique_train_history_layers:
    start_z: 1
    end_z: 157
    count: 157
  validation_test_exclusion: true
  statistic_sampling:
    pixel_stride: 8
    sampled_grid_per_frame: [188, 188]
  source_audit_outputs:
    - processed/normalization_v1/train_stage_led_summary.csv
    - processed/normalization_v1/train_stage_led_summary.json

working_roi:
  coordinates_raw_camera_pixels: [250, 250, 1750, 1750]
  coordinate_order: [x0, y0, x1_exclusive, y1_exclusive]
  status: provisional_working_roi
  rationale: >-
    This candidate retained the lowest mean sampled full-scale saturation among
    the evaluated ROI candidates, but it does not by itself resolve saturation.
    A final geometric ROI requires later Dataset and weak-target validation.

raw_input:
  dtype: uint16
  full_scale_value: 65535
  stage_names:
    A: AfterSpreading
    B: Burned
  led_channels: [1, 2, 3]

saturation_validity_mask:
  expression: raw_pixel < 65535
  true_meaning: valid_for_intensity_statistics_and_masked_loss
  false_meaning: full_scale_saturated_pixel
  creation: on_the_fly_per_frame
  persist_mask_images: false
  use_in_dataset:
    return_per_led_mask_channels: true
    mask_shape: [3, H, W]
  use_in_training:
    exclude_invalid_pixels_from_denoising_loss: true
    expose_mask_to_heatmap_or_fusion_model: true
  note: >-
    Saturated raw values are clipped by intensity normalization but remain
    distinguishable through mask value 0. The mask prevents the sensor ceiling
    from being interpreted as ordinary brightness or a defect cue.

normalization:
  formula: clip((raw_pixel - p01) / (p99 - p01), 0.0, 1.0)
  clip_range: [0.0, 1.0]
  scope: separate_parameters_per_stage_and_led
  output_dtype: float32
  statistic_population: valid_pixels_only
  parameters:
    A:
      led_1:
        p01: 19300.0
        p99: 65295.0
        scale_p99_minus_p01: 45995.0
        full_scale_fraction_train_sample: 0.3861942531
        valid_fraction_train_sample: 0.6138057469
      led_2:
        p01: 11234.0
        p99: 65135.0
        scale_p99_minus_p01: 53901.0
        full_scale_fraction_train_sample: 0.4982144556
        valid_fraction_train_sample: 0.5017855444
      led_3:
        p01: 12611.0
        p99: 61310.0
        scale_p99_minus_p01: 48699.0
        full_scale_fraction_train_sample: 0.0373848803
        valid_fraction_train_sample: 0.9626151197
    B:
      led_1:
        p01: 2464.0
        p99: 65263.0
        scale_p99_minus_p01: 62799.0
        full_scale_fraction_train_sample: 0.5099311444
        valid_fraction_train_sample: 0.4900688556
      led_2:
        p01: 11058.0
        p99: 65135.0
        scale_p99_minus_p01: 54077.0
        full_scale_fraction_train_sample: 0.5013923209
        valid_fraction_train_sample: 0.4986076791
      led_3:
        p01: 11874.0
        p99: 64783.0
        scale_p99_minus_p01: 52909.0
        full_scale_fraction_train_sample: 0.0862801063
        valid_fraction_train_sample: 0.9137198937

model_input_contract:
  intensity_channels: 3
  validity_mask_channels: 3
  stage_conditioning: required
  sequence_length_k: 4
  time_axis: manufacturing_layer_z
  input_description: >-
    Each stage sample provides three normalized LED intensity channels plus
    three aligned per-LED validity-mask channels. The A/B stage identity is
    passed through stage conditioning rather than a shared global scaler.

limitations_and_follow_up:
  - The full-scale equality rule is the initial saturation policy; evaluate a near-saturation threshold only if later residual analysis shows a remaining ceiling artifact.
  - The working ROI is not the final geometric ROI.
  - Parameter values are fixed from train history layers only and must not be recalculated using validation or test data.
  - This config is for the baseline Dataset and model input contract; weak-label projection may require an additional spatial validity policy.
