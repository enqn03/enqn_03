version: 1
status: experimental_baseline
purpose: >
  First causal A-only baseline for predicting a direction-unresolved,
  XCT-derived continuous quality response from AfterSpreading layer-camera
  history. This is not a binary defect classifier.
data:
  stage: A
  sequence_length_k: 4
  input_channels: 6
  model_resolution: [256, 256]
  batch_size: 2
  num_workers: 0
  pin_memory: false
model:
  name: a_only_causal_candidate_net
  base_channels: 8
  temporal_kernel_size: 3
  output_activation: sigmoid
  output_name: candidate_response_prediction
loss:
  config: configs/masked_regression_loss_v1.yaml
  target_name: xct_derived_continuous_quality_response
  response_direction: unresolved
optimizer:
  name: AdamW
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
training:
  epochs: 8
  seed: 20260827
  device: auto
  select_best_by: validation_supported_pixel_mean_smooth_l1
  skip_optimizer_step_when_batch_has_no_support: true
evaluation:
  top_k_candidates_per_endpoint: 5
  local_maximum_kernel_size: 7
  spatial_plateau_range_atol: 0.000001
  top_score_tie_atol: 0.000001
  top_score_tie_fraction_max: 0.001
  temporal_map_mae_atol: 0.000001
  temporal_map_max_abs_atol: 0.000001
  spatial_plateau_policy: >
    Return no coordinate candidate when the entire prediction map is numerically
    flat, when the top score is tied across more than 0.1 percent of model pixels,
    or when consecutive endpoint maps are numerically invariant. These are
    support-independent decoder safety gates, not defect thresholds.
  score_semantics: >
    Sigmoid-scaled prediction of the XCT-derived continuous quality response.
    It is not an anomaly probability or confirmed defect score while response
    direction remains unresolved.
storage:
  output_directory: outputs/a_only_baseline_v1
  overwrite_output_directory: false
  checkpoint_name: best_validation_supported_loss.pt
  history_name: training_history.json
  test_metrics_name: test_metrics.json
  test_candidates_name: test_coordinate_candidates.json
  persist_dense_heatmaps: false
provenance:
  causal_manifest: manifests/causal_sequence_manifest.csv
  normalization_config: configs/normalization_v1.yaml
  weak_target_config: configs/weak_target_v1.yaml
  loss_config: configs/masked_regression_loss_v1.yaml
